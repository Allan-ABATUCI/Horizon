; Surcouche à php.ini-production (copié tel quel comme php.ini) : ferme la
; fuite d'info expose_php, et règle OPcache pour un déploiement où le code
; ne change qu'au build de l'image (pas de watch de fichiers en prod).
expose_php = Off
memory_limit = 256M

opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
